name: Publish validated EMR web patch 67

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-patch67-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PATCH_SOURCE: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-1d44-820e-838c-647861def2b9/raw?se=2026-09-16T14%3A28%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=80509f1a-6467-5159-88cc-fd673579e51c&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T06%3A40%3A56Z&ske=2026-09-17T06%3A40%3A56Z&sks=b&skv=2026-02-06&sig=u3ww9bDvv6vmgFL09MTtenWwPyUUZvwiVBg%2BSTRLR/c%3D'
      PATCH_SHA256: 'f5c7b64f36f4ae1e54dd5c8380590ddfaf0d18dd2135b23903dea1785ee34f1e'
      PATCH_SIZE: '376641'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify validated CI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/emr67
          curl -LfsS --retry 3 --retry-delay 2 "$PATCH_SOURCE" -o /tmp/emr67/artifact.zip
          unzip -q /tmp/emr67/artifact.zip -d /tmp/emr67/artifact
          test -f /tmp/emr67/artifact/EMR-web-patch.zip
          echo "$PATCH_SHA256  /tmp/emr67/artifact/EMR-web-patch.zip" | sha256sum -c -
          test "$(stat -c%s /tmp/emr67/artifact/EMR-web-patch.zip)" = "$PATCH_SIZE"
      - name: Stage patch 67 and atomic OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patches/67
          cp /tmp/emr67/artifact/EMR-web-patch.zip patches/67/EMR-web-patch.zip
          unzip -p /tmp/emr67/artifact/EMR-web-patch.zip patch-manifest.json > patches/67/patch-manifest.json
          printf '%s  %s\n' "$PATCH_SHA256" 'EMR-web-patch.zip' > patches/67/EMR-web-patch.sha256
          cat > latest.json <<'JSON'
          {
            "type": "web-patch",
            "version": "0.31.27",
            "build": "A1-HYB-dev03127",
            "sequence": 67,
            "sha256": "f5c7b64f36f4ae1e54dd5c8380590ddfaf0d18dd2135b23903dea1785ee34f1e",
            "url": "https://raw.githubusercontent.com/EquilibrioIntegral/EMR-updates/main/patches/67/EMR-web-patch.zip",
            "minNativeVersionCode": 49,
            "published": true
          }
          JSON
      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EquilibrioIntegral OTA Publisher'
          git config user.email 'equilibriointegral.coach@gmail.com'
          git add latest.json patches/67/EMR-web-patch.zip patches/67/patch-manifest.json patches/67/EMR-web-patch.sha256
          git diff --cached --exit-code && { echo 'Nothing to publish'; exit 0; } || true
          git commit -m 'publish validated OTA web patch 67'
          git push origin HEAD:main
