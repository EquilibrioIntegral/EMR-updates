name: Publish validated EMR web patch 57

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-patch57-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PATCH_SOURCE: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-f494-81f4-a7b6-8d14980d5d08/raw?se=2026-09-16T13%3A19%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=a9b48a41-6c2a-57ae-bc29-fdf722964ec1&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T19%3A08%3A42Z&ske=2026-09-16T19%3A08%3A42Z&sks=b&skv=2026-02-06&sig=m1ppm91yK7dCRpKGG3i72KZNbw5KMPT7hcjy3SOiFgk%3D'
      PATCH_SHA256: 'db5cf75a3d82222660a538326bb7186dc09c0e01fb00b92adf5bba45800bf973'
      PATCH_SIZE: '375040'
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify validated CI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/emr57
          curl -LfsS --retry 3 --retry-delay 2 "$PATCH_SOURCE" -o /tmp/emr57/artifact.zip
          unzip -q /tmp/emr57/artifact.zip -d /tmp/emr57/artifact
          test -f /tmp/emr57/artifact/EMR-web-patch.zip
          echo "$PATCH_SHA256  /tmp/emr57/artifact/EMR-web-patch.zip" | sha256sum -c -
          test "$(stat -c%s /tmp/emr57/artifact/EMR-web-patch.zip)" = "$PATCH_SIZE"

      - name: Stage patch 57 and atomic OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patches/57
          cp /tmp/emr57/artifact/EMR-web-patch.zip patches/57/EMR-web-patch.zip
          unzip -p /tmp/emr57/artifact/EMR-web-patch.zip patch-manifest.json > patches/57/patch-manifest.json
          printf '%s  %s\n' "$PATCH_SHA256" 'EMR-web-patch.zip' > patches/57/EMR-web-patch.sha256
          cat > latest.json <<'JSON'
          {
            "type": "web-patch",
            "version": "0.31.27",
            "build": "A1-HYB-dev03127",
            "sequence": 57,
            "sha256": "db5cf75a3d82222660a538326bb7186dc09c0e01fb00b92adf5bba45800bf973",
            "url": "https://raw.githubusercontent.com/EquilibrioIntegral/EMR-updates/main/patches/57/EMR-web-patch.zip",
            "minNativeVersionCode": 49,
            "published": true
          }
          JSON

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EquilibrioIntegral OTA Publisher'
          git config user.email 'equilibriointegral.coach@gmail.com'
          git add latest.json patches/57/EMR-web-patch.zip patches/57/patch-manifest.json patches/57/EMR-web-patch.sha256
          git diff --cached --exit-code && { echo 'Nothing to publish'; exit 0; } || true
          git commit -m 'publish validated OTA web patch 57'
          git push origin HEAD:main
