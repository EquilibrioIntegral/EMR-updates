name: Publish validated EMR web patch 48

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-patch48-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PATCH_SOURCE: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-2be4-8210-8f3f-3b98a9e3c8e3/raw?se=2026-09-16T12%3A03%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=ef169bc2-f025-5967-a6cf-75972a5a625e&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T18%3A11%3A22Z&ske=2026-09-16T18%3A11%3A22Z&sks=b&skv=2026-02-06&sig=bktrY/1TltWynpCMnf5vQsrf5qQSev1SAfNrW3gxZb0%3D'
      PATCH_SHA256: '50aed64b2a0bd1b06aa2493d264579215be4f1fe7e28c3361fd6b886751b2205'
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify validated CI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/emr48
          curl -LfsS --retry 3 --retry-delay 2 "$PATCH_SOURCE" -o /tmp/emr48/artifact.zip
          unzip -q /tmp/emr48/artifact.zip -d /tmp/emr48/artifact
          test -f /tmp/emr48/artifact/EMR-web-patch.zip
          echo "$PATCH_SHA256  /tmp/emr48/artifact/EMR-web-patch.zip" | sha256sum -c -
          test "$(stat -c%s /tmp/emr48/artifact/EMR-web-patch.zip)" = "373733"

      - name: Stage patch 48 and atomic OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patches/48
          cp /tmp/emr48/artifact/EMR-web-patch.zip patches/48/EMR-web-patch.zip
          unzip -p /tmp/emr48/artifact/EMR-web-patch.zip patch-manifest.json > patches/48/patch-manifest.json
          printf '%s  %s\n' "$PATCH_SHA256" 'EMR-web-patch.zip' > patches/48/EMR-web-patch.sha256
          cat > latest.json <<'JSON'
          {
            "type": "web-patch",
            "version": "0.31.27",
            "build": "A1-HYB-dev03127-profile-entry-gate",
            "sequence": 48,
            "sha256": "50aed64b2a0bd1b06aa2493d264579215be4f1fe7e28c3361fd6b886751b2205",
            "url": "https://raw.githubusercontent.com/EquilibrioIntegral/EMR-updates/main/patches/48/EMR-web-patch.zip",
            "minNativeVersionCode": 49,
            "published": true
          }
          JSON

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EquilibrioIntegral OTA Publisher'
          git config user.email 'equilibriointegral.coach@gmail.com'
          git add latest.json patches/48/EMR-web-patch.zip patches/48/patch-manifest.json patches/48/EMR-web-patch.sha256
          git diff --cached --exit-code && { echo 'Nothing to publish'; exit 0; } || true
          git commit -m 'publish validated OTA web patch 48'
          git push origin HEAD:main
