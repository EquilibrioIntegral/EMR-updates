name: Publish validated EMR web patch 52

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-patch52-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PATCH_SOURCE: 'https://sdmntpreastus.oaiusercontent.com/files/00000000-d234-81f9-a134-24b047566c13/raw?se=2026-09-16T12%3A44%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=35e5ebd8-d71a-5a23-a85a-b1e5b4023884&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T21%3A18%3A02Z&ske=2026-09-16T21%3A18%3A02Z&sks=b&skv=2026-02-06&sig=XeIJ8u3m09t/pwEd/ljaxpRcuv5Di4ldGNz7BXtkRSc%3D'
      PATCH_SHA256: 'a2ee6bbd7d6fc3bc2b0c50ec116532737300fcc1aebc645e14efa9d3a961dea7'
      PATCH_SIZE: '373923'
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify validated CI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/emr52
          curl -LfsS --retry 3 --retry-delay 2 "$PATCH_SOURCE" -o /tmp/emr52/artifact.zip
          unzip -q /tmp/emr52/artifact.zip -d /tmp/emr52/artifact
          test -f /tmp/emr52/artifact/EMR-web-patch.zip
          echo "$PATCH_SHA256  /tmp/emr52/artifact/EMR-web-patch.zip" | sha256sum -c -
          test "$(stat -c%s /tmp/emr52/artifact/EMR-web-patch.zip)" = "$PATCH_SIZE"

      - name: Stage patch 52 and atomic OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patches/52
          cp /tmp/emr52/artifact/EMR-web-patch.zip patches/52/EMR-web-patch.zip
          unzip -p /tmp/emr52/artifact/EMR-web-patch.zip patch-manifest.json > patches/52/patch-manifest.json
          printf '%s  %s\n' "$PATCH_SHA256" 'EMR-web-patch.zip' > patches/52/EMR-web-patch.sha256
          cat > latest.json <<'JSON'
          {
            "type": "web-patch",
            "version": "0.31.27",
            "build": "A1-HYB-dev03127-profile-gate-racefix",
            "sequence": 52,
            "sha256": "a2ee6bbd7d6fc3bc2b0c50ec116532737300fcc1aebc645e14efa9d3a961dea7",
            "url": "https://raw.githubusercontent.com/EquilibrioIntegral/EMR-updates/main/patches/52/EMR-web-patch.zip",
            "minNativeVersionCode": 49,
            "published": true
          }
          JSON

      - name: Commit publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EquilibrioIntegral OTA Publisher'
          git config user.email 'equilibriointegral.coach@gmail.com'
          git add latest.json patches/52/EMR-web-patch.zip patches/52/patch-manifest.json patches/52/EMR-web-patch.sha256
          git diff --cached --exit-code && { echo 'Nothing to publish'; exit 0; } || true
          git commit -m 'publish validated OTA web patch 52'
          git push origin HEAD:main
